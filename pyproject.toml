[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftest"
version = "0.1.0"
description = "Test, explain, and lint Falco rules against the real Falco engine"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ftest = "ftest.cli:main"

[tool.setuptools]
packages = ["ftest"]

[tool.setuptools.package-data]
ftest = ["guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905", "E501"]
